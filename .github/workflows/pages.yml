# Publish the site to GitHub Pages on every push to main.
#
# There is no build step to run: the site is static HTML, CSS and plain <script>
# files, and the data is already baked into data/*.js. So this uploads the repo as
# it stands. No Node, no bundler, nothing to break.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # the repo root is the site root; cache/ is gitignored so it never ships
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
